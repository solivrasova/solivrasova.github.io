/* === Background Slideshow === */
.slideshow {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
}

.slide {
    position: absolute;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    opacity: 0;
    animation: fade 24s infinite;
}

.slide:nth-child(1) { background-image: url('bg1.jpg'); }
.slide:nth-child(2) { background-image: url('bg2.jpg'); animation-delay: 6s; }
.slide:nth-child(3) { background-image: url('bg3.jpg'); animation-delay: 12s; }
.slide:nth-child(4) { background-image: url('bg4.jpg'); animation-delay: 18s; }

@keyframes fade {
    0% { opacity: 0; }
    10% { opacity: 1; }
    30% { opacity: 1; }
    40% { opacity: 0; }
    100% { opacity: 0; }
}

/* === Layout === */
.container {
    padding: 80px 20px;
}

h1 {

    border: none;
    border-radius: 25px;
    font-size: 18px;
    cursor: pointer;
}

.footer {

    opacity: 0.6;
}
</style>
